{% set name = "PyWaffle" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: f2f30de1ad76ec0c2a982ff173812b13b17647d0d5080bb50d8eb59f5897e1f4

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - matplotlib-base

test:
  requires:
    - python {{ python_min }}
  imports:
    - pywaffle

about:
  home: https://github.com/ligyxy/PyWaffle
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A FigureClass of Matplotlib to make waffle chart.

  description: |
    PyWaffle is a Python package to make waffle chart, bases on Matplotlib.
    It provides a Figure constructor class Waffle, which could be passed to 
    matplotlib.pyplot.figure and generates a matplotlib Figure object.
  doc_url: https://pywaffle.readthedocs.io/en/latest/
  dev_url: https://github.com/ligyxy/PyWaffle

extra:
  recipe-maintainers:
    - philip-khor
